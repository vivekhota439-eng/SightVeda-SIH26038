<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLions" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="50%" stop-color="#8F6B12"/>
      <stop offset="100%" stop-color="#5E4306"/>
    </linearGradient>
    <filter id="govShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Side: Emblem of India (Ashoka Lion Capital) -->
  <g transform="translate(15, 6)" filter="url(#govShadow)">
    <!-- Central Main Lion -->
    <path d="M 45,12 C 45,6 55,2 65,2 C 75,2 85,6 85,12 C 87,17 84,24 81,28 C 84,33 82,38 78,42 C 75,46 72,50 65,50 C 58,50 55,46 52,42 C 48,38 46,33 49,28 C 46,24 43,17 45,12 Z" fill="url(#goldLions)"/>
    <!-- Central Lion Face details -->
    <ellipse cx="65" cy="22" rx="10" ry="12" fill="#E6C665"/>
    <circle cx="61" cy="19" r="2" fill="#3D2903"/>
    <circle cx="69" cy="19" r="2" fill="#3D2903"/>
    <path d="M 63,25 L 67,25 L 65,28 Z" fill="#3D2903"/>
    <!-- Whiskers & Chin -->
    <path d="M 59,32 C 63,35 67,35 71,32" stroke="#3D2903" stroke-width="1.5" fill="none"/>

    <!-- Left Lion (Profile) -->
    <path d="M 46,22 C 38,20 32,24 28,30 C 24,37 26,45 32,50 C 37,53 43,53 48,48 C 45,40 44,30 46,22 Z" fill="url(#goldLions)"/>
    <circle cx="34" cy="31" r="1.8" fill="#3D2903"/>

    <!-- Right Lion (Profile) -->
    <path d="M 84,22 C 92,20 98,24 102,30 C 106,37 104,45 98,50 C 93,53 87,53 82,48 C 85,40 86,30 84,22 Z" fill="url(#goldLions)"/>
    <circle cx="96" cy="31" r="1.8" fill="#3D2903"/>

    <!-- Lion Bodies & Legs -->
    <path d="M 36,52 L 40,78 L 50,78 L 48,54 Z" fill="url(#goldLions)"/>
    <path d="M 54,52 L 54,78 L 62,78 L 62,52 Z" fill="url(#goldLions)"/>
    <path d="M 68,52 L 68,78 L 76,78 L 76,52 Z" fill="url(#goldLions)"/>
    <path d="M 82,54 L 80,78 L 90,78 L 94,52 Z" fill="url(#goldLions)"/>

    <!-- Abacus Platform -->
    <rect x="22" y="78" width="86" height="18" rx="2" fill="#8F6B12"/>
    <rect x="24" y="80" width="82" height="14" rx="1.5" fill="#E6C665"/>

    <!-- Ashoka Chakra on Abacus (Center) -->
    <circle cx="65" cy="87" r="6" fill="#0D47A1"/>
    <circle cx="65" cy="87" r="4.5" fill="#FFFFFF"/>
    <circle cx="65" cy="87" r="1.5" fill="#0D47A1"/>
    <!-- Chakra Spokes -->
    <line x1="65" y1="81" x2="65" y2="93" stroke="#0D47A1" stroke-width="0.8"/>
    <line x1="59" y1="87" x2="71" y2="87" stroke="#0D47A1" stroke-width="0.8"/>
    <line x1="60.8" y1="82.8" x2="69.2" y2="91.2" stroke="#0D47A1" stroke-width="0.8"/>
    <line x1="60.8" y1="91.2" x2="69.2" y2="82.8" stroke="#0D47A1" stroke-width="0.8"/>

    <!-- Galloping Horse (Left) & Bull (Right) representations -->
    <circle cx="38" cy="87" r="3.5" fill="#8F6B12"/>
    <circle cx="92" cy="87" r="3.5" fill="#8F6B12"/>

    <!-- Base Pedestal (Lotus Base) -->
    <path d="M 30,96 C 45,102 85,102 100,96 L 96,104 C 80,108 50,108 34,104 Z" fill="#8F6B12"/>
    <rect x="32" y="104" width="66" height="4" rx="1" fill="#5E4306"/>

    <!-- Inscription: सत्यमेव जयते -->
    <text x="65" y="119" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#3D2903" text-anchor="middle" letter-spacing="1.2">सत्यमेव जयते</text>
  </g>

  <!-- Right Side: Official Typography -->
  <g transform="translate(130, 24)">
    <!-- Hindi: भारत सरकार -->
    <text x="0" y="32" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#1B254B" letter-spacing="1">भारत सरकार</text>
    
    <!-- English: GOVERNMENT OF INDIA -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="800" fill="#2E3A59" letter-spacing="1.5">GOVERNMENT OF INDIA</text>
    
    <!-- Ministry Sub-line -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#718096" letter-spacing="0.5">Ministry of Health &amp; Family Welfare</text>
  </g>
</svg>
